# profile.example.yaml — template. `job-profile-setup` generates the real
# profile.yaml (gitignored) by interviewing you and ingesting your docs.
# Field values here are placeholders showing the expected shape.

identity:
  full_name: ""
  email: ""
  phone: ""
  location: ""                 # current city, country
  links:
    linkedin: ""
    github: ""
    portfolio: ""

work_authorization:
  countries_authorized: []     # e.g. ["UK", "EU"] — where you can work without sponsorship
  needs_sponsorship: null      # true/false — do you require visa sponsorship
  notice_period_weeks: null

preferences:
  desired_salary:
    currency: ""
    min: null
    max: null
    period: "year"             # year | month | hour
  willing_to_relocate: null
  work_modes: []               # subset of: remote, hybrid, onsite
  target_locations: []         # cities/regions you'll apply in

experience:
  total_years: null
  seniority: ""                # e.g. "mid", "senior"
  years_per_skill: {}          # e.g. {Python: 5, SQL: 4, AWS: 2} — for numeric screening questions
  current_title: ""

# Optional. Used only when an application explicitly asks. Always skippable.
demographics:
  gender: ""
  ethnicity: ""
  veteran_status: ""
  disability_status: ""

# Free-form answers to recurring application questions, so the applier can
# reuse them instead of regenerating. Keyed by a normalized question.
saved_answers: {}              # e.g. {"why do you want to work here": "..."}
