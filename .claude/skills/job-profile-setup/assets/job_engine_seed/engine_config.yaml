# engine_config.yaml — the tunable "brain" of the job-application skills.
# Edit via the `tune-job-engine` skill (or by hand). `apply-to-jobs` and
# `job-profile-setup` read this on every run, so changes take effect with no
# code edits. Ported/generalized from JobBot.py's globals + hardcoded rules.

# ---- Selection ----------------------------------------------------------
selection:
  fit_floor: 0.55          # 0..1 — skip jobs scoring below this (logged, not applied)
  rank_by_fit: true        # apply best-fit first; false = first-match order
  max_per_run: 0           # 0 = no cap (honor the N the user asks for). >0 enforces a ceiling.
  max_per_day: 30          # cross-run cap on submitted applications per local day; 0 = unlimited

# ---- Pacing (human-like; reduces LinkedIn bot-flagging) -----------------
pacing:
  min_action_delay_sec: 1.5
  max_action_delay_sec: 5.0
  min_job_delay_sec: 20      # between finishing one application and starting the next
  max_job_delay_sec: 90
  backoff_on_friction: true  # slow way down if LinkedIn shows a friction/verify signal

# ---- Answer tone (Q&A free-text screening answers) ----------------------
answers:
  tone: "professional"       # tune-job-engine knob: professional | formal | warm | concise
  default_one_line: false    # true => keep free-text answers to a single sentence

# ---- Resume tailoring rules (JobBot mode-0, generalized) ----------------
# These replace the values JobBot hardcoded into the prompt text. Edit to taste.
resume:
  pages: 2                              # target length; tailoring preserves ~char counts
  locked_skills:                        # never swap these out (JobBot: first 5 skills)
    - Python
    - R
    - Java
    - C++
    - Pytorch
    - Tensorflow
  locked_areas_of_interest:             # never modify these areas of interest
    - "AI-Based Market Analysis"
    - "Augmented-Analytics"
  skill_coverage_target: 0.90           # JD skills present in resume (cond. 1)
  resume_skill_relevance_target: 0.75   # JD skills encompass >= this fraction of resume (cond. 2)
  cert_swap_min_gain: 0.15              # swap a cert only if it lifts interview odds >= this
  max_project_point_edits: 3
  suggest_new_projects: 2               # new project points to suggest (true-to-context)

# ---- Cover-letter tailoring rules (JobBot mode-2, generalized) ----------
cover_letter:
  pages: 1                              # expand 0.75pg base -> ~1pg
  company_placeholder: "Fitch Ratings"  # replace with target company name everywhere
  standout_bullets_min: 3
  standout_bullets_max: 5
  skill_coverage_target: 0.90
  cl_skill_relevance_target: 0.85
  attach_only_if_slot: true             # only generate/attach a CL when the form offers a slot

# ---- Grounding / anti-fabrication (hard rule) ---------------------------
grounding:
  evidence_file: "evidence.md"
  # Tailoring/answers may ONLY reframe true facts present in resume + evidence.
  # Never invent experience, years, employers, or credentials. Non-negotiable.
  strict: true
  allow_terms: []   # terms checks.py claims should accept (recurring false positives)

# ---- Browser ------------------------------------------------------------
browser:
  profile_dir: "browser_profile"        # persistent Playwright user-data-dir (relative to job_engine/)
  headless: false                       # headed so the user can complete CAPTCHA/2FA when needed
  channel: "chrome"                     # use installed Chrome; fallback to bundled chromium

# ---- Autorun (scheduled, unattended runs) -------------------------------
# Read only by scheduled runs (scripts/autorun.py). Interactive runs ignore it.
autorun:
  schedule:
    time: "09:00"                    # local 24h
    days: "MON,TUE,WED,THU,FRI"      # schtasks /D format; cron derived from it
  searches:                          # each search submits up to `count` applications
    - query: "AI Engineer"
      geoId: 101165590               # UK
      filters: {f_AL: true, f_TPR: r86400}   # Easy Apply only, posted in last 24h
      count: 10
